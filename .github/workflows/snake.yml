# Draws the contribution graph as a snake eating it, in both worlds' colours,
# and publishes the two SVGs to the `output` branch that the README reads.
name: snake

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ffb84d&color_dots=#161b25,#0f3a3a,#1c6e6b,#2fa8a1,#57e0d8
            dist/snake-light.svg?color_snake=#35800f&color_dots=#d9e3f0,#b7e6fd,#7cc2e8,#00b2ff,#0079bf
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
