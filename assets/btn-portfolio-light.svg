<svg xmlns="http://www.w3.org/2000/svg" width="178" height="56" viewBox="0 0 178 56" role="img" aria-label="Portfolio">
<title>Portfolio</title>
<style>
@font-face{font-family:'JD Source';src:url(data:font/woff2;base64,) format('woff2');font-weight:200 900;}
text{font-family:'JD Source', system-ui, sans-serif;fill:#06344f;}
.label{font-family:'JD Source', system-ui, sans-serif;font-weight:600;letter-spacing:0.01em;fill:#163d54;}
.tnum{font-variant-numeric:tabular-nums;}
.lb{font-family:'JD Source', system-ui, sans-serif;font-weight:600;font-size:21px;letter-spacing:0.01em;fill:#ffffff;}.go .band{animation:band .9s cubic-bezier(.4,0,.2,1) .5s both}@keyframes band{to{transform:translateX(268px)}}.go .lb,.go .ic{animation:rise .8s cubic-bezier(.16,1,.3,1) .1s both}@keyframes rise{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*:not(.hold){animation:none!important;}.hold{animation-play-state:paused!important;}}
</style>
<g class="jd"><set attributeName="class" to="jd go" begin="0.05s" fill="freeze"/>
<defs><linearGradient id="aq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18a6ee"/><stop offset=".5" stop-color="#0088d0"/><stop offset="1" stop-color="#0079bf"/></linearGradient>
<linearGradient id="aqe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#00385a" stop-opacity=".35"/></linearGradient>
<linearGradient id="aqs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-10%" y="-20%" width="120%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#006aa8" flood-opacity=".4"/></filter>
<clipPath id="top"><rect x="10" y="6" width="158" height="19.32"/></clipPath>
<clipPath id="body"><rect x="10" y="6" width="158" height="42" rx="21"/></clipPath></defs>
<g filter="url(#gl)"><rect x="10" y="6" width="158" height="42" rx="21" fill="url(#aq)"/></g>
<rect x="10.5" y="6.5" width="157" height="41" rx="20.5" fill="none" stroke="url(#aqe)"/>
<g clip-path="url(#top)"><rect x="11" y="7" width="156" height="40" rx="20" fill="url(#aqs)"/></g>
<g clip-path="url(#body)"><path class="band" d="M-70 6h34l-14 42h-34z" fill="url(#bd)"/></g>
<g class="ic"><g transform="translate(32 17) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5"/></g></g>
<text class="lb" x="62" y="33.9">Portfolio</text>
</g>
</svg>
